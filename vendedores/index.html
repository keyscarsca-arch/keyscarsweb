<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keys Cars · Catálogo Vendedores</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#EEF1F6;--panel:#FFFFFF;--line:#DCE3EE;
    --navy:#0D47A1;--navy-dark:#0A3980;--navy-darker:#082C61;
    --gold:#FFD700;--gold-dark:#E3BE00;
    --text:#0F2038;--text-dim:#26303F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.45;}
  h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-0.015em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 28px;}

  header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{height:44px;width:auto;flex:none;object-fit:contain;}
  .brand-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;line-height:1;letter-spacing:0.02em;color:var(--navy);}
  .brand-text b{font-weight:800;
    background:linear-gradient(100deg,#B8890A 0%,#FFD700 22%,#FFFBEA 42%,#FFD700 62%,#B8890A 85%,#FFD700 100%);
    background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shineText 4s linear infinite;text-shadow:0 0 12px rgba(255,215,0,0.25);}
  @keyframes shineText{0%{background-position:0% 0;}100%{background-position:-260% 0;}}
  .brand-sub{font-size:10px;color:var(--text-dim);letter-spacing:0.14em;margin-top:2px;}
  .role-pill{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    background:var(--navy);color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:6px 12px;white-space:nowrap;}

  .intro{background:linear-gradient(135deg,var(--navy-darker),var(--navy));border-bottom:4px solid var(--gold);color:#fff;padding:22px 0;}
  .intro h1{font-size:26px;}
  .intro p{margin:6px 0 0;color:#cfe0fb;font-size:14.5px;}

  .tools{padding-top:18px;padding-bottom:4px;}
  .currency{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .currency-label{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:0.04em;text-transform:uppercase;}
  .seg{display:inline-flex;background:#fff;border:2px solid var(--navy);border-radius:12px;overflow:hidden;}
  .seg button{border:none;background:#fff;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;
    padding:11px 26px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;}
  .seg button .sym{font-size:19px;}
  .seg button.active{background:var(--navy);color:var(--gold);}
  .search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 14px;height:46px;margin-bottom:14px;}
  .search-box input{background:transparent;border:none;outline:none;color:var(--text);width:100%;font-size:16px;}
  .search-box input::placeholder{color:#9AA6BA;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:8px 14px;border-radius:20px;font-size:13.5px;border:1px solid var(--line);color:var(--text-dim);background:#fff;white-space:nowrap;}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
  .result-count{font-size:13.5px;color:var(--text-dim);margin-bottom:14px;}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;
    transition:border-color .15s, transform .12s;cursor:pointer;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card-thumb{height:110px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy);border:1px solid var(--line);overflow:hidden;}
  .card-thumb img{width:100%;height:100%;object-fit:contain;padding:8px;transition:transform .18s;}
  .card-thumb img:not(.is-placeholder){
    -webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 50%, black 60%, rgba(0,0,0,0.5) 80%, transparent 100%);
    mask-image:radial-gradient(ellipse 75% 75% at 50% 50%, black 60%, rgba(0,0,0,0.5) 80%, transparent 100%);}
  .card:hover .card-thumb img{transform:scale(1.06);}
  .card-cat{font-size:11px;color:var(--navy);letter-spacing:0.04em;font-weight:600;text-transform:uppercase;}
  .card-desc{font-size:14px;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:38px;}
  .card-code{font-size:12px;color:var(--text-dim);font-family:monospace;}
  .price{margin-top:auto;display:flex;align-items:baseline;justify-content:center;gap:4px;
    background:var(--navy);color:#fff;border-radius:8px;padding:8px 10px;border:1px solid var(--gold);
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.01em;}
  .price .cur{color:var(--gold);font-size:15px;}
  .price.none{background:#fff;color:var(--text-dim);border-color:var(--line);font-size:14px;font-weight:700;}

  .load-more-wrap{display:flex;justify-content:center;margin:26px 0 8px;}
  .load-more{background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:10px;padding:12px 28px;font-weight:700;font-size:15px;display:none;}
  footer{text-align:center;color:var(--text-dim);font-size:12.5px;padding:26px 16px calc(34px + env(safe-area-inset-bottom));}
  footer b{color:var(--navy);}

  .overlay{position:fixed;inset:0;background:rgba(8,28,60,0.62);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;border:3px solid var(--gold);position:relative;}
  .modal-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:20px;line-height:1;z-index:2;}
  .modal-img{height:300px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .modal-img img{width:100%;height:100%;object-fit:contain;padding:22px;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.18));}
  .modal-img img.is-placeholder{padding:36px;filter:none;}
  .modal-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;}
  .modal-body h3{font-size:19px;line-height:1.25;}
  .modal-price{margin-top:10px;font-size:30px;padding:12px 10px;}
  .modal-price .cur{font-size:22px;}

  .lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy-darker),var(--navy));z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .lock.open{display:flex;}
  .lock-box{background:#fff;border:3px solid var(--gold);border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center;}
  .lock-box img{height:56px;margin-bottom:10px;}
  .lock-box h2{font-size:21px;color:var(--navy);}
  .lock-box p{font-size:14px;color:var(--text-dim);margin:8px 0 14px;}
  .lock-box input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px;margin-bottom:10px;}
  .lock-box button{width:100%;height:46px;border:2px solid var(--gold);background:var(--navy);color:#fff;border-radius:8px;font-weight:700;font-size:15px;}
  .lock-err{color:#B00020;font-size:13.5px;min-height:18px;margin-bottom:8px;}

  @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media (max-width:860px){.grid{grid-template-columns:repeat(3,1fr);}.wrap{padding:0 18px;}}
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .wrap{padding:0 14px;}
    .card{padding:11px;gap:8px;}
    .card-thumb{height:92px;}
    .brand-text{font-size:19px;}
    .brand-mark{height:38px;}
    .role-pill{font-size:10.5px;padding:5px 9px;}
    .intro h1{font-size:21px;}
    .seg button{padding:10px 22px;}
    .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex:none;}
    .price{font-size:17px;}
    .modal-img{height:250px;}
  }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <img src="logo.png" alt="Keys Cars">
    <h2>Acceso de vendedores</h2>
    <p>Escribe o pega el código de acceso que te dio Keys Cars.</p>
    <input type="password" id="lockInput" placeholder="Código de acceso" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="lock-err" id="lockErr"></div>
    <button id="lockBtn">Entrar</button>
  </div>
</div>

<header>
  <nav class="wrap">
    <div class="brand">
      <img class="brand-mark" src="logo.png" alt="Keys Cars Motos & House">
      <div>
        <div class="brand-text"><b>KEYS CARS</b></div>
        <div class="brand-sub">MOTOS &amp; HOUSE</div>
      </div>
    </div>
    <span class="role-pill">Vendedores</span>
  </nav>
</header>

<section class="intro">
  <div class="wrap">
    <h1>Catálogo para vendedores</h1>
    <p>Consulta productos y precios. Elige la moneda: Dólar o Euro.</p>
  </div>
</section>

<main class="wrap tools">
  <div class="currency">
    <span class="currency-label">Moneda</span>
    <div class="seg" role="tablist" aria-label="Moneda">
      <button id="tabUSD" class="active" role="tab" aria-selected="true"><span class="sym">$</span> Dólar</button>
      <button id="tabEUR" role="tab" aria-selected="false"><span class="sym">€</span> Euro</button>
    </div>
  </div>
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#59677E" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="searchInput" placeholder="Buscar por código o descripción..." autocomplete="off">
  </div>
  <div class="chips" id="chipsWrap"></div>
  <div class="result-count" id="resultCount"></div>
  <div class="grid" id="productGrid"></div>
  <div class="load-more-wrap"><button class="load-more" id="loadMoreBtn">Cargar más productos</button></div>
</main>

<footer>
  <b>Keys Cars Motos &amp; House C.A.</b> · Uso interno de vendedores<br>
  <span id="updated"></span>
</footer>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
    <div class="modal-img"><img id="modalImg" alt=""></div>
    <div class="modal-body">
      <div class="card-cat" id="modalCat"></div>
      <h3 id="modalTitle"></h3>
      <div class="card-code" id="modalCode"></div>
      <div class="price modal-price" id="modalPrice"></div>
    </div>
  </div>
</div>

<script>
/* Los precios viajan CIFRADOS (AES-256-GCM) en datos.bin. Solo se pueden leer con el
   código que va en el link. Sin el código, el archivo es ilegible. */
let PRODUCTS = [], categories = ["Todos"];
let currency = 'USD', activeCategory = "Todos", searchTerm = "", visibleCount = 24;
const PAGE_SIZE = 24;
const LS_KEY = 'kc_vend_code', LS_CUR = 'kc_vend_cur';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function b64uToBytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function decryptData(code){
  const keyBytes = b64uToBytes(code.trim());
  if(keyBytes.length !== 32) throw new Error('bad key');
  const res = await fetch('datos.bin', {cache:'no-store'});
  if(!res.ok) throw new Error('no data');
  const buf = new Uint8Array(await res.arrayBuffer());
  const iv = buf.slice(0,12), ct = buf.slice(12);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

const CATEGORY_ORDER = ["LLAVES TIPO CISA","LLAVES RESIDENCIALES Y ESPECIALES","LLAVES PARA MOTOS Y VEHICULOS","HERRAMIENTAS, REPUESTOS Y ACCESORIOS CERRAJERIA","CILINDROS CANDADOS Y CERRADURAS","PORTACHIP","CARCASAS","LLAVEROS","CONTROLES Y TELEMANDOS","LLAVES CON CHIP","PRODUCTOS Xhorse","CONTROLES KEYDIY","ESPADINES PARA VVDI XHORSE","PRODUCTOS CISA","LLAVES SILCA - FLEXON"];
function categoryRank(c){ const i = CATEGORY_ORDER.indexOf(c); return i === -1 ? 999 : i; }
function naturalCompare(a,b){
  const re=/(\d+)|(\D+)/g, A=String(a).match(re)||[], B=String(b).match(re)||[];
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const ap=A[i]||'', bp=B[i]||'', an=parseInt(ap,10), bn=parseInt(bp,10);
    if(!isNaN(an)&&!isNaN(bn)){ if(an!==bn) return an-bn; }
    else if(ap!==bp) return ap<bp?-1:1;
  }
  return 0;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmt(n){ return n.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function priceHTML(p){
  const v = currency === 'USD' ? p.u : p.e;
  const sym = currency === 'USD' ? '$' : '€';
  if(!v || v <= 0) return null;
  return `<span class="cur">${sym}</span><span>${fmt(v)}</span>`;
}

/* ---- imágenes (misma lógica del catálogo público) ---- */
function placeholderIconType(cat){
  cat = cat || '';
  if(cat.indexOf('CONTROL')!==-1||cat.indexOf('TELEMANDO')!==-1) return 'remote';
  if(cat.indexOf('CHIP')!==-1||cat.indexOf('XHORSE')!==-1) return 'chip';
  if(cat.indexOf('CANDADO')!==-1||cat.indexOf('CERRADURA')!==-1) return 'padlock';
  if(cat.indexOf('CILINDRO')!==-1) return 'lock';
  return 'key';
}
const TILE_ICONS = {
  key:`<circle cx="130" cy="200" r="64" fill="none" stroke="url(#g)" stroke-width="20"/><circle cx="130" cy="200" r="16" fill="#0b1a33"/><rect x="188" y="188" width="150" height="24" rx="6" fill="url(#g)"/><rect x="284" y="212" width="16" height="30" rx="3" fill="url(#g)"/><rect x="308" y="212" width="16" height="38" rx="3" fill="url(#g)"/>`,
  padlock:`<path d="M155 175V140a45 45 0 0 1 90 0v35" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/><rect x="130" y="175" width="140" height="105" rx="18" fill="url(#g)"/><circle cx="200" cy="220" r="14" fill="#0b1a33"/><rect x="192" y="228" width="16" height="26" rx="6" fill="#0b1a33"/>`,
  lock:`<circle cx="200" cy="200" r="90" fill="url(#g)"/><circle cx="200" cy="200" r="60" fill="#0e1c38"/><circle cx="200" cy="185" r="18" fill="url(#g)"/><path d="M200 205 L182 245 H218 Z" fill="url(#g)"/>`,
  chip:`<rect x="120" y="120" width="160" height="160" rx="18" fill="url(#g)"/><rect x="160" y="160" width="80" height="80" rx="10" fill="#0d2015" stroke="#FFD700" stroke-width="4"/>`,
  remote:`<rect x="160" y="90" width="80" height="220" rx="26" fill="url(#g)"/><circle cx="200" cy="140" r="12" fill="#E00210"/><rect x="175" y="185" width="50" height="16" rx="8" fill="#5a6577"/><rect x="175" y="215" width="50" height="16" rx="8" fill="#5a6577"/>`
};
function placeholderTile(cat){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="b" cx="50%" cy="38%" r="75%"><stop offset="0%" stop-color="#1a52a3"/><stop offset="100%" stop-color="#071834"/></radialGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF3B0"/><stop offset="45%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8890A"/></linearGradient></defs><rect width="400" height="400" fill="url(#b)"/>${TILE_ICONS[placeholderIconType(cat)]}</svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}
const EXTS = ['jpg','webp','jpeg','png'];
window.__imgFallback = function(img){
  const i = parseInt(img.getAttribute('data-i')||'0',10)+1, code = img.getAttribute('data-code');
  if(code && i < EXTS.length){ img.setAttribute('data-i',String(i)); img.src = '../imagenes_productos/'+encodeURIComponent(code)+'.'+EXTS[i]; return; }
  img.onerror = null; img.src = placeholderTile(img.getAttribute('data-cat')); img.classList.add('is-placeholder');
};
function imgTag(p, cls){
  return `<img ${cls?`class="${cls}" `:''}src="../imagenes_productos/${encodeURIComponent(p.c)}.jpg" data-code="${esc(p.c)}" data-cat="${esc(p.cat)}" data-i="0" alt="${esc(p.d)}" loading="lazy" onerror="window.__imgFallback(this)">`;
}

/* ---- pantalla ---- */
function renderChips(){
  const wrap = document.getElementById('chipsWrap'); wrap.innerHTML = '';
  categories.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'chip' + (cat===activeCategory?' active':'');
    b.textContent = cat.toUpperCase();
    b.addEventListener('click', ()=>{ activeCategory = cat; visibleCount = PAGE_SIZE; renderChips(); renderGrid(); });
    wrap.appendChild(b);
  });
}
function getFiltered(){
  const term = searchTerm.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const catOk = activeCategory==='Todos' || p.cat===activeCategory;
    return catOk && (!term || p.c.toLowerCase().includes(term) || p.d.toLowerCase().includes(term));
  });
}
function renderGrid(){
  const filtered = getFiltered(), grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  filtered.slice(0, visibleCount).forEach(p=>{
    const ph = priceHTML(p);
    const card = document.createElement('div');
    card.className = 'card'; card.setAttribute('data-code', p.c);
    card.innerHTML = `
      <div class="card-thumb">${imgTag(p,'card-thumb-img')}</div>
      <div class="card-cat">${esc(p.cat)}</div>
      <div class="card-desc">${esc(p.d)}</div>
      <div class="card-code">${esc(p.c)}</div>
      <div class="price${ph?'':' none'}">${ph || 'Consultar'}</div>`;
    card.addEventListener('click', ()=> openModal(p));
    grid.appendChild(card);
  });
  document.getElementById('resultCount').textContent = `${filtered.length} producto${filtered.length===1?'':'s'} encontrado${filtered.length===1?'':'s'}`;
  document.getElementById('loadMoreBtn').style.display = visibleCount < filtered.length ? 'inline-flex' : 'none';
}
function openModal(p){
  document.getElementById('modalImg').className = '';
  document.getElementById('modalImg').outerHTML = imgTag(p).replace('<img ','<img id="modalImg" ');
  document.getElementById('modalCat').textContent = p.cat;
  document.getElementById('modalTitle').textContent = p.d;
  document.getElementById('modalCode').textContent = p.c;
  const ph = priceHTML(p), el = document.getElementById('modalPrice');
  el.className = 'price modal-price' + (ph?'':' none'); el.innerHTML = ph || 'Consultar';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm = e.target.value; visibleCount = PAGE_SIZE; renderGrid(); });
document.getElementById('loadMoreBtn').addEventListener('click', ()=>{ visibleCount += PAGE_SIZE; renderGrid(); });

function setCurrency(c){
  currency = c; lsSet(LS_CUR, c);
  const u = document.getElementById('tabUSD'), e = document.getElementById('tabEUR');
  u.classList.toggle('active', c==='USD'); e.classList.toggle('active', c==='EUR');
  u.setAttribute('aria-selected', c==='USD'); e.setAttribute('aria-selected', c==='EUR');
  if(PRODUCTS.length) renderGrid();
}
document.getElementById('tabUSD').addEventListener('click', ()=>setCurrency('USD'));
document.getElementById('tabEUR').addEventListener('click', ()=>setCurrency('EUR'));

function startApp(data){
  PRODUCTS = data.items.map(p=>({c:p.c, cat:p.cat, d:p.d, u:p.u, e:p.e}));
  PRODUCTS.sort((a,b)=>{
    const ra=categoryRank(a.cat), rb=categoryRank(b.cat);
    if(ra!==rb) return ra-rb;
    if(a.cat!==b.cat) return a.cat<b.cat?-1:1;
    return naturalCompare(a.c,b.c);
  });
  const present = Array.from(new Set(PRODUCTS.map(p=>p.cat)))
    .sort((a,b)=> categoryRank(a)-categoryRank(b) || (a<b?-1:1));
  categories = ["Todos", ...present];
  if(data.act) document.getElementById('updated').textContent = 'Precios actualizados: ' + data.act;
  renderChips(); renderGrid();
}

const lock = document.getElementById('lock');
async function tryCode(code, fromUser){
  try{
    const data = await decryptData(code);
    lsSet(LS_KEY, code.trim());
    lock.classList.remove('open');
    startApp(data);
    return true;
  }catch(err){
    if(fromUser) document.getElementById('lockErr').textContent = 'Código incorrecto o sin conexión. Revisa e intenta de nuevo.';
    return false;
  }
}
document.getElementById('lockBtn').addEventListener('click', ()=> tryCode(document.getElementById('lockInput').value, true));
document.getElementById('lockInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryCode(e.target.value, true); });

(async function init(){
  const saved = lsGet(LS_CUR); if(saved==='USD'||saved==='EUR') setCurrency(saved);
  let code = decodeURIComponent((location.hash||'').replace(/^#/,'')).replace(/^k=/,'');
  const stored = lsGet(LS_KEY);
  if(code){
    const ok = await tryCode(code, false);
    if(ok){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} return; }
  }
  if(stored && await tryCode(stored, false)) return;
  lsDel(LS_KEY);
  lock.classList.add('open');
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{}); });
}
</script>
